spring.application.name=homelive
server.port=8080

# Configuracao do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:homelivedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Acesso visual em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Token de login (JWT HS256). Em produção, defina JWT_SECRET (mín. 32 caracteres); o padrão é só para desenvolvimento.
homelive.jwt.secret=${JWT_SECRET:homelive-segredo-de-desenvolvimento-trocar-em-producao}
# Validade do token: marcado "lembrar de mim" = 30 dias; sem marcar = 1 dia.
homelive.jwt.validade-lembrar-dias=30
homelive.jwt.validade-padrao-horas=24

# Formato de data JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
