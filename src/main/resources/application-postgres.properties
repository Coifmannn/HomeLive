# Perfil "postgres": dados persistem num PostgreSQL de verdade.
# Ativar com:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Sem este perfil a API continua no H2 em memória (e os testes também).
#
# Credenciais vêm de variáveis de ambiente; os valores depois do ":" são o padrão.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homelive}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza as tabelas a partir das entidades (@Entity).
spring.jpa.hibernate.ddl-auto=update

# O console do H2 não faz sentido aqui: use o pgAdmin.
spring.h2.console.enabled=false
